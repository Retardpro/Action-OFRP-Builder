
name: OrangeFox Recovery Build

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ofox-roadstr-${{ github.ref }}
  cancel-in-progress: false

env:
  SYNC_URL: https://gitlab.com/OrangeFox/sync.git
  MANIFEST_BRANCH: "14.1"

  DEVICE_TREE_URL: https://github.com/Retardpro/ofox_device_motorola_roadstr
  DEVICE_TREE_BRANCH: main
  DEVICE_PATH: device/motorola/roadstr
  DEVICE_NAME: roadstr

  MAKEFILE_NAME: twrp_roadstr-ap2a-eng
  KERNEL_VERSION: 6.6.139-MioTest-gf77elb4f66al

  CCACHE_DIR: /home/runner/.cache/ccache
  CCACHE_MAXSIZE: 5G

jobs:
  build:
    name: Build OrangeFox for roadstr
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install dependencies and ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache git curl repo \
            python3 python-is-python3 \
            bc bison build-essential flex \
            zip unzip rsync \
            libssl-dev libelf-dev libncurses-dev \
            zlib1g-dev lz4 liblz4-tool \
            libxml2-utils xsltproc schedtool cpio \
            imagemagick jq

          mkdir -p "$CCACHE_DIR"

          echo "USE_CCACHE=1" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"
          echo "CCACHE_EXEC=$(command -v ccache)" >> "$GITHUB_ENV"

          ccache --max-size="$CCACHE_MAXSIZE"
          ccache --version

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/ccache
          key: ${{ runner.os }}-ofx-roadstr-ccache-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-ofx-roadstr-ccache-${{ github.ref_name }}-
            ${{ runner.os }}-ofx-roadstr-ccache-

      - name: Configure ccache
        run: |
          ccache --max-size="$CCACHE_MAXSIZE"
          ccache --show-stats

      - name: Configure swap
        run: |
          set -eux

          if sudo swapon --show=NAME --noheadings | grep -qx '/swapfile'; then
            sudo swapoff /swapfile
          fi

          if sudo test -e /swapfile; then
            sudo rm -f /swapfile
          fi

          sudo fallocate -l 30G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

          free -h
          sudo swapon --show

       - name: Install repo launcher
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/repo" --version

      - name: Sync OrangeFox source
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/orangefox-sync"
          git clone --depth=1 "$SYNC_URL" \
            "$GITHUB_WORKSPACE/orangefox-sync"

          cd "$GITHUB_WORKSPACE/orangefox-sync"
          chmod +x orangefox_sync.sh

          ./orangefox_sync.sh \
            --branch "$MANIFEST_BRANCH" \
            --path "$GITHUB_WORKSPACE/fox_$MANIFEST_BRANCH"

      - name: Clone device tree
        run: |
          set -e
          SOURCE_DIR="$GITHUB_WORKSPACE/fox_$MANIFEST_BRANCH"

          git clone --depth=1 \
            --single-branch \
            -b "$DEVICE_TREE_BRANCH" \
            "$DEVICE_TREE_URL" \
            "$GITHUB_WORKSPACE/device-tree"

          mkdir -p "$SOURCE_DIR/$DEVICE_PATH"

          cp -a "$GITHUB_WORKSPACE/device-tree/." \
            "$SOURCE_DIR/$DEVICE_PATH/"

          test -f "$SOURCE_DIR/$DEVICE_PATH/twrp_roadstr.mk"

      - name: Generate kernel_version.txt
        run: |
          set -e

          SOURCE_DIR="$GITHUB_WORKSPACE/fox_$MANIFEST_BRANCH"
          OUTPUT_DIR="$SOURCE_DIR/out/target/product/$DEVICE_NAME"

          mkdir -p "$OUTPUT_DIR"

          printf '%s\n' "$KERNEL_VERSION" \
            > "$OUTPUT_DIR/kernel_version.txt"

          echo "Generated kernel_version.txt:"
          cat "$OUTPUT_DIR/kernel_version.txt"

      - name: Build OrangeFox recovery
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/fox_$MANIFEST_BRANCH"

          export USE_CCACHE=1
          export CCACHE_DIR="$HOME/.cache/ccache"
          export CCACHE_EXEC="$(command -v ccache)"

          source build/envsetup.sh

          export ALLOW_MISSING_DEPENDENCIES=true

          lunch "$MAKEFILE_NAME"

          mka adbd recoveryimage -j"$(nproc --all)"

      - name: Show ccache statistics
        if: always()
        run: |
          ccache --show-stats || true

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.cache/ccache
          key: ${{ runner.os }}-ofx-roadstr-ccache-${{ github.ref_name }}-${{ github.run_id }}

      - name: Collect recovery artifacts
        if: success()
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/fox_$MANIFEST_BRANCH"

          mkdir -p "$GITHUB_WORKSPACE/release"

          find "out/target/product/$DEVICE_NAME" \
            -maxdepth 1 -type f \
            \( -name 'OrangeFox-R*.img' \
            -o -name 'OrangeFox-R*.zip' \) \
            -exec cp -t "$GITHUB_WORKSPACE/release" {} +

          test -n "$(ls -A "$GITHUB_WORKSPACE/release")"

          cp "out/target/product/$DEVICE_NAME/kernel_version.txt" \
            "$GITHUB_WORKSPACE/release/"

          ls -lh "$GITHUB_WORKSPACE/release"

      - name: Upload recovery artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-roadstr
          path: release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Publish GitHub Release
        if: success()
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_id }}
          name: OrangeFox roadstr build ${{ github.run_number }}
          files: |
            release/OrangeFox-R*.img
            release/OrangeFox-R*.zip
            release/kernel_version.txt
          fail_on_unmatched_files: true
          
