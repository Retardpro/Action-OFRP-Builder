
name: OrangeFox Recovery Build

on:
  workflow_dispatch:
    inputs:
      device_tree_url:
        description: Device tree repository
        required: true
        type: choice
        default: https://github.com/Retardpro/android_device_motorola_roadstr
        options:
          - https://github.com/Retardpro/android_device_motorola_roadstr
          - https://gitlab.com/OrangeFox/device/roadstr_new

      device_tree_branch:
        description: Device tree branch
        required: true
        type: choice
        default: fox_14.1
        options:
          - fox_14.1
          - auto-dfe

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    env:
      SYNC_URL: https://gitlab.com/OrangeFox/sync.git
      MANIFEST_BRANCH: "14.1"
      DEVICE_TREE_URL: ${{ inputs.device_tree_url }}
      DEVICE_TREE_BRANCH: ${{ inputs.device_tree_branch }}
      DEVICE_PATH: device/motorola/roadstr
      DEVICE_NAME: roadstr
      MAKEFILE_NAME: twrp_roadstr-eng
      BUILD_TARGET: recovery

    steps:
      - name: Initialize workspace
        id: workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/workspace"
          echo "path=$GITHUB_WORKSPACE/workspace" >> "$GITHUB_OUTPUT"

      - name: Prepare build environment
        working-directory: ${{ steps.workspace.outputs.path }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            linux-modules-extra-$(uname -r) \
            git python3 tar aria2

          curl -fsSL \
            https://gitlab.com/OrangeFox/misc/scripts/-/raw/master/setup/android_build_env.sh \
            -o android_build_env.sh

          sudo bash android_build_env.sh

      - name: Install Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "11"

      - name: Sync OrangeFox 14.1 sources
        working-directory: ${{ steps.workspace.outputs.path }}
        run: |
          git clone --depth=1 "$SYNC_URL" sync

          ./sync/orangefox_sync.sh \
            --branch "$MANIFEST_BRANCH" \
            --path "$PWD/fox_$MANIFEST_BRANCH"

      - name: Get recovery commit
        id: recovery_commit
        working-directory: ${{ steps.workspace.outputs.path }}/fox_14.1/bootable/recovery
        run: |
          echo "commit=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Clone device tree
        working-directory: ${{ steps.workspace.outputs.path }}/fox_14.1
        run: |
          git clone --depth=1 \
            --branch "$DEVICE_TREE_BRANCH" \
            "$DEVICE_TREE_URL" \
            "$DEVICE_PATH"

      - name: Get device tree commit
        id: devtree_commit
        working-directory: ${{ steps.workspace.outputs.path }}/fox_14.1/device/motorola/roadstr
        run: |
          echo "commit=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 30

      - name: Build OrangeFox recovery
        working-directory: ${{ steps.workspace.outputs.path }}/fox_14.1
        run: |
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true

          lunch "$MAKEFILE_NAME"
          mka adbd "${BUILD_TARGET}image" -j"$(nproc --all)"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: roadstr-${{ env.DEVICE_TREE_BRANCH }}-${{ steps.devtree_commit.outputs.commit }}
          tag_name: ${{ github.run_id }}
          fail_on_unmatched_files: true
          files: |
            ${{ steps.workspace.outputs.path }}/fox_14.1/out/target/product/roadstr/OrangeFox-R*.img
            ${{ steps.workspace.outputs.path }}/fox_14.1/out/target/product/roadstr/OrangeFox-R*.zip
          body: |
            ## Motorola Edge 70 (roadstr)

            - Manifest: OrangeFox 14.1
            - Target: ${{ env.BUILD_TARGET }}
            - Device tree branch: ${{ env.DEVICE_TREE_BRANCH }}
            - Device tree repository: ${{ env.DEVICE_TREE_URL }}
            - Device tree commit: ${{ steps.devtree_commit.outputs.commit }}
            - Recovery commit: ${{ steps.recovery_commit.outputs.commit }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
